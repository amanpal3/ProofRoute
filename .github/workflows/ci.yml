name: ProofRoute CI

on:
  push:
    branches: [ main, AML ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Smart Contract Quality Gates
  smart-contracts:
    name: Foundry Contracts Test & Fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge Tests & Fuzzing
        working-directory: ./contracts
        run: |
          forge --version
          forge build --sizes
          forge test -vvv

  # 2. Backend & ML Forensics Quality Gates
  backend-ml:
    name: FastAPI & ML Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        run: |
          python -m pytest test_basic.py -v

      - name: Run ML Forensics Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest ml/tests -v

  # 3. Frontend Web App Quality Gates
  frontend:
    name: Next.js Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Next.js Production Build
        working-directory: ./frontend
        run: npm run build
